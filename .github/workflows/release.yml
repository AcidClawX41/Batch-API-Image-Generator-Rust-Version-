# Build & Release — compila los binarios de las tres plataformas.
#
# Batch Image Generator — Eric Valls Gramunt
#
# QUÉ SE ARREGLÓ AQUÍ
# -------------------
# La versión anterior subía **cada binario dos veces**: primero con su nombre
# de compilación (`xai-imagine-generator`) y después con el nombre por
# plataforma. El problema es que Linux y macOS producen un ejecutable con el
# mismo nombre, así que ambos subían un asset llamado `xai-imagine-generator`
# a la misma release: se pisaban entre ellos y quedaba uno solo, sin manera de
# saber cuál. Ahora se sube una vez, siempre con el nombre de la plataforma.
#
# También se añade macOS Intel (los Mac anteriores a 2020 no ejecutan un
# binario arm64) y se puede lanzar a mano o por etiqueta, sin tener que crear
# antes la release desde la web.

name: Build & Release

on:
  # Publicar una release sigue disparando las compilaciones.
  release:
    types: [published]
  # Empujar una etiqueta v* crea la release y sube los binarios.
  push:
    tags: ['v*']
  # Y desde la pestaña Actions se puede compilar sin publicar nada: los
  # binarios quedan como artefactos de la ejecución durante 30 días.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binario: xai-imagine-generator.exe
            nombre: batch-image-generator-windows-x86_64.exe

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binario: xai-imagine-generator
            nombre: batch-image-generator-linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binario: xai-imagine-generator
            nombre: batch-image-generator-macos-arm64

          - os: macos-13
            target: x86_64-apple-darwin
            binario: xai-imagine-generator
            nombre: batch-image-generator-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Slint necesita fontconfig y xkbcommon para compilar el backend de
      # ventanas; ubuntu-22.04 no los trae de serie.
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config \
            cmake

      # Se compila el árbol tal cual: si los tests o clippy fallan, es mejor
      # enterarse aquí que publicar una release rota.
      - name: Tests
        run: cargo test --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Compilar release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Preparar el artefacto
        shell: bash
        run: |
          set -euo pipefail
          origen="target/${{ matrix.target }}/release/${{ matrix.binario }}"
          cp "$origen" "${{ matrix.nombre }}"
          # `strip` reduce bastante el tamaño; en Windows no aplica.
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "${{ matrix.nombre }}" || true
            chmod +x "${{ matrix.nombre }}"
          fi
          ls -la "${{ matrix.nombre }}"

      # Siempre disponible, se publique o no la release.
      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}
          retention-days: 30

      # Una sola subida por plataforma, con nombre único: sin colisiones.
      - name: Subir a la release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.nombre }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Los ficheros de instalación del escritorio no dependen de la plataforma:
  # se empaquetan una vez.
  extras:
    name: Extras de Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar
        run: tar czf batch-image-generator-packaging.tar.gz packaging/

      - uses: actions/upload-artifact@v4
        with:
          name: batch-image-generator-packaging
          path: batch-image-generator-packaging.tar.gz
          retention-days: 30

      - name: Subir a la release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: batch-image-generator-packaging.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
